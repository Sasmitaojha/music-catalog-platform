spring.application.name=music-catalog-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musicdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:musicCatalogInsightsSuperSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
