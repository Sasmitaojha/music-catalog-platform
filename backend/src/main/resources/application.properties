spring.application.name=music-catalog-backend
server.port=8080

# H2 In-Memory Database Configuration (Default Development)
spring.datasource.url=jdbc:h2:mem:musicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=musicCatalogInsightsSuperSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.musiccatalog.backend=INFO
logging.level.org.springframework.security=WARN
