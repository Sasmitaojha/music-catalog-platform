version: '3.8'

services:
  backend:
    image: openjdk:17-jdk-slim
    container_name: music_backend_dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_gradle_cache:/home/gradle/.gradle
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:musicdb
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=password
    command: ["sh", "-c", "chmod +x ./gradlew && ./gradlew bootRun"]

  frontend:
    image: node:22-alpine
    container_name: music_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8080/api
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

volumes:
  backend_gradle_cache:
  frontend_node_modules:
